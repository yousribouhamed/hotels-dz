name: BoumerdesStays
options:
  bundleIdPrefix: com.boumerdesstays
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  BoumerdesStays:
    type: application
    platform: iOS
    sources:
      - path: BoumerdesStays
        excludes:
          - "Resources/img"
          - "Resources/img/**"
      - path: BoumerdesStays/Resources/img
        type: folder
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: BoumerdesStays/BoumerdesStays.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boumerdesstays.app
        PRODUCT_NAME: BoumerdesStays
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Zalumo"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationQueriesSchemes: "tel"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_PREVIEWS: YES
